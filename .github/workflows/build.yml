# Builds Preset Picker for Windows x64, Windows ARM64 and macOS (Apple Silicon).
# Push a tag like v1.0.0 to publish a GitHub Release with all three downloads;
# run it by hand (Actions > Build > Run workflow) to just test the builds.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            asset: PresetPicker-Windows-x64.zip
          - os: windows-11-arm
            arch: arm64
            asset: PresetPicker-Windows-ARM64.zip
          - os: macos-14
            arch: arm64
            asset: PresetPicker-macOS-AppleSilicon.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: |
          python tools/make_icon.py
          pyinstaller preset_picker.spec --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Preset Picker" -DestinationPath "${{ matrix.asset }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Preset Picker.app" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: PresetPicker-*.zip
          generate_release_notes: true

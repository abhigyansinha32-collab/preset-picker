# Builds Preset Picker for Windows x64 and macOS (Apple Silicon).
# Windows on ARM runs the x64 build through Windows 11's built-in emulation: a native ARM64
# build doesn't work yet because pythonnet's clr_loader ships no ARM64 ClrLoader.dll.
# Windows ships as an installer (PresetPicker-Setup-x64.exe) plus a portable zip.
# Push a tag like v1.0.0 to publish a GitHub Release with the downloads;
# run it by hand (Actions > Build > Run workflow) to just test the builds.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            asset: PresetPicker-Windows-x64.zip
          - os: macos-latest   # Apple Silicon runner
            arch: arm64
            asset: PresetPicker-macOS-AppleSilicon.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: |
          python tools/make_icon.py
          pyinstaller preset_picker.spec --noconfirm

      - name: Launch test (unzipped, as downloaded from the internet)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: ./tools/smoke_windows.ps1

      - name: Clear test marks before packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem "dist/Preset Picker" -Recurse -File | Unblock-File

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = python -c "from presetpicker import __version__; print(__version__)"
          & $iscc "/DAppVersion=$version" installer\PresetPicker.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist\PresetPicker-Setup-x64.exe .

      - name: Launch test (installed with the setup)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: ./tools/smoke_windows.ps1 -Installer PresetPicker-Setup-x64.exe

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Preset Picker" -DestinationPath "${{ matrix.asset }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Preset Picker.app" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            PresetPicker-Setup-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PresetPicker-*.zip
            PresetPicker-Setup-*.exe
          generate_release_notes: true

# Takes real screenshots of installing the app on clean Windows and Mac machines, for the
# website's install guides. Run by hand: Actions > Install screenshots > Run workflow.
name: Install screenshots

on:
  workflow_dispatch:

jobs:
  shots:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python tools/make_icon.py
          pyinstaller preset_picker.spec --noconfirm

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = python -c "from presetpicker import __version__; print(__version__)"
          & $iscc "/DAppVersion=$version" installer\PresetPicker.iss
          Move-Item dist\PresetPicker-Setup-x64.exe .

      - name: Screenshots (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: ./tools/screenshots_windows.ps1 -Installer PresetPicker-Setup-x64.exe -Out shots

      - name: Screenshots (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          ditto -c -k --keepParent "dist/Preset Picker.app" PresetPicker-macOS-AppleSilicon.zip
          bash tools/screenshots_mac.sh PresetPicker-macOS-AppleSilicon.zip shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ runner.os }}
          path: shots/
